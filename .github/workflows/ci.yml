name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  integration:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - wordpress: 6.4.14
            php: '8.1'
          - wordpress: 6.4.14
            php: '8.2'
          - wordpress: 6.4.14
            php: '8.3'
          - wordpress: 7.1.4
            php: '8.1'
          - wordpress: 7.1.4
            php: '8.2'
          - wordpress: 7.1.4
            php: '8.3'

    env:
      WP_ENV_CORE: https://downloads.wordpress.org/release/wordpress-${{ matrix.wordpress }}.zip
      WP_ENV_PHP_VERSION: ${{ matrix.php }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: ./bin/composer install --no-interaction --prefer-dist

      - name: Run WordPress integration tests
        run: npm run test:integration

  verify:
    name: Verify plugin
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: ./bin/composer install --no-interaction --prefer-dist

      - name: Run JavaScript lint
        run: npm run check:js

      - name: Run JavaScript tests
        run: npm run test:js

      - name: Build admin assets
        run: npm run build

      - name: Run PHP unit tests
        run: npm run test:php

      - name: Audit dependency licenses
        run: |
          npm run check:licenses:self-test
          npm run check:licenses

      - name: Audit dependency vulnerabilities
        run: npm run check:dependencies

      - name: Set up Go for pinned Gitleaks CLI
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.24.11'

      - name: Install pinned Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan repository files for credentials
        run: npm run check:secrets

      - name: Build release artifact
        run: npm run build:release

      - name: Package traceable development ZIP
        env:
          UME_SOURCE_SHA: ${{ github.sha }}
        run: |
          npm run package:artifact
          cd dist/artifacts
          sha256sum -c *.sha256
          test "$(cat *.zip.source)" = "$UME_SOURCE_SHA"

      - name: Upload development ZIP artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: universal-markdown-editor-development-build
          path: dist/artifacts/*
          if-no-files-found: error
          retention-days: 7

  plugin-check:
    name: WordPress Plugin Check
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_ENV_CORE: https://downloads.wordpress.org/release/wordpress-7.1.4.zip
      WP_ENV_PHP_VERSION: '8.1'

    steps:
      - name: Download verified development ZIP
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: universal-markdown-editor-development-build
          path: dist/artifacts

      - name: Verify and extract the exact package
        shell: bash
        env:
          UME_SOURCE_SHA: ${{ github.sha }}
          UME_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd dist/artifacts
          packages=( *.zip )
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          sha256sum -c "${package}.sha256"
          test "$(cat "${package}.source")" = "$UME_SOURCE_SHA"
          mkdir -p ../plugin-check
          unzip -q "$package" -d ../plugin-check
          plugin=../plugin-check/universal-markdown-editor
          test -f "$plugin/universal-markdown-editor.php"
          test -f "$plugin/readme.txt"
          grep -Fx "Source commit: $UME_SOURCE_SHA" "$plugin/BUILD-INFO.txt"
          {
            echo "Workflow run: $UME_RUN_URL"
            echo "Source commit: $UME_SOURCE_SHA"
            echo "Plugin Check action: 10857da14b6c2246d15402b3e69f777edcf8c12e (v1.1.9)"
            sha256sum "$package"
          } | tee "$RUNNER_TEMP/plugin-check-provenance.txt"

      - name: Check packaged plugin with official tooling
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: dist/plugin-check/universal-markdown-editor
          repo-token: ''

      - name: Upload package check provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-check-provenance
          path: ${{ runner.temp }}/plugin-check-provenance.txt
          if-no-files-found: warn
          retention-days: 7
